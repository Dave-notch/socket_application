<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">

    <style>
       html, body {
  margin: 0;
  background-color: #0b0f1a;
  height: 100%;
  font-family: smooch sans;
  scroll-behavior: smooth;
}

.bg-wrapper {

  background-position: center top;
  background-size: cover;



  overflow: hidden;
  height: 96.3dvh;
}



/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.soosiki{
  margin-left: 1rem;
}

nav {
  position: fixed;
  top: 0;
  width: 100%;
  backdrop-filter: blur(12px);
  background: rgba(10, 14, 25, 0.7);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  z-index: 100;
}

.nav-container {
  max-width: 1200px;
  margin: auto;
  padding: 11px 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: 1px;
  color: #e6eaff;
  cursor: pointer;
}

.nav-links {
  display: flex;
  gap: 2rem;
}

.nav-links a {
  position: relative;
  text-decoration: none;
  color: #cfd8ff;
  font-size: 1.5rem;
  transition: color 0.3s ease;
  
  
}

.nav-links a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -6px;
  width: 0%;
  height: 2px;
  background: #4da3ff;
  transition: width 0.3s ease;
}

        .label{
            padding-left: 0.5rem;
        }
        .label2{
            padding-right: 0.5rem;
        }

        .label3{
            padding-bottom: 0.5rem;
        }

        

        .corner{
            margin-left: 18.9rem;
        }
           .sooceli{
            margin-right: 1rem;
         }

        .menu-toggle {
            display: none;
            font-size: 1.6rem;
            background: none;
            border: none;
            color: #e6eaff;
            cursor: pointer;
        } 


        @media (max-width: 768px) {
        .menu-toggle {
            display: block;
       }

         .nav-links {
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(10, 14, 25, 0.95);
            backdrop-filter: blur(10px);
            flex-direction: column;
            width: 200px;
            padding: 16px;
            gap: 16px;
            display: none;
         }

          .nav-links.active {
            display: flex;
            }
       }


          @media (max-width: 480px) {

             /* .nav-container {
              display: none;
 
              } */

              .soosiki{
                margin-left: 2rem;
              }

              .bg-wrapper {
                height: 100dvh; 
            }
        
              .side-barA{
                width: 0vh;
                min-height: 90dvh;
            }

            input{
              width: 35vh;
              margin-left: 2rem;
            }

            .send{
              margin-right: 2rem;
            }



            .innerGR{
              width: 9rem;
            }
     }
  

    


      @media (hover: hover) {
    

        .nav-links a:hover {
            color: #ffffff;
            scale: 1.1;
            transition: 0.5s;
        }

        .nav-links a:hover::after {
                  width: 100%;
       }
}

    </style>
     <div class="flex flex-col gap-15">
   <nav class="nav">

           <button class="menu-toggle" aria-label="Toggle menu">

        <div class="nav-links">

          <a href="#">Overview</a>
        </div>
      </div>
    </nav>

    <div class="flex justify-center items-center rounded bg-wrapper ">
        <div class="flex justify-center items-center">

            <div class="flex flex-col gap-1">
                <div class="bg-gray-500 w-128 h-190 rounded-xl shadow-2xl border border:blue-200 flex side-barA p-10  opacity-75" id="text_area">
                    <div id="messeges" class="flex flex-col justify-end min-h-full  label3 gap-2">

                         <div>

                         </div>
                         <p class="text-sm text-green-700 border-t flex label2 justify-end">7:00</p>
                        </div>  -->
                    </div>
               </div>
           <div class="flex flex-row gap-2">  
            <input class="w-[clamp(2rem,90vw,26.8rem)] rounded-xl bg-blue-200 h-8 py-2 label outline-none focus:ring-1 focus:ring-green-200 " placeholder="Message" id="input_area" type="text">
            <button class="bg-green-500 w-20 text-white text-2xl rounded-xl font-semibold hover:bg-red-400 cursor-pointer send" id="SendBtn">Send</button>
           </div>
        </div>
        </div>

    </div>
